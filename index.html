<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f3f1">
  <meta name="description" content="A quiet clock, made yours. Customize analog and digital displays, typography, themes, and time zones.">
  <title>Still — Clock</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191d20'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23f2f3f1' stroke-width='1.5'/%3E%3Cpath d='M16 9v7l5 3' fill='none' stroke='%23f2f3f1' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23cf553d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="i18n.js?v=2" defer></script>
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <header class="topbar chrome">
    <a class="wordmark" href="./" aria-label="Still home">still<span class="brand-dot">.</span></a>
    <div class="header-actions">
      <span class="zone-label" id="headerZone">Local time</span>
      <span class="divider"></span>
      <button class="icon-button" id="focusButton" title="Focus mode" aria-label="Enter focus mode" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <button class="icon-button" id="fullscreenButton" title="Full screen (F)" aria-label="Enter full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button>
      <button class="settings-button" id="settingsButton" title="Settings (S)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span>Settings</span></button>
    </div>
  </header>

  <main id="clockMain" data-mode="both" data-layout="stacked">
    <div class="date-line" id="dateLine">&nbsp;</div>
    <div class="clock-pair" id="clockPair">
      <div class="analog-wrap" id="analogWrap">
        <svg id="analogClock" class="analog-clock" viewBox="0 0 400 400" role="img" aria-label="Analog clock">
          <circle class="dial-background" cx="200" cy="200" r="197"/>
          <circle class="dial-border" cx="200" cy="200" r="197"/>
          <g id="ticks"></g><g id="numbers"></g>
          <g id="hourHand"><path class="hour-hand" d="M194 213L196 111Q200 105 204 111L206 213Z"/></g>
          <g id="minuteHand"><path class="minute-hand" d="M197 218L198 65Q200 61 202 65L203 218Z"/></g>
          <g id="secondHand"><path class="second-hand" d="M200 231V45"/><circle class="second-counterweight" cx="200" cy="225" r="5"/></g>
          <circle class="hand-center" cx="200" cy="200" r="7"/><circle class="hand-center-inner" cx="200" cy="200" r="3"/>
        </svg>
      </div>
      <div class="digital-wrap" id="digitalWrap">
        <div class="digital-time" id="digitalTime" role="timer" aria-live="off"><span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span><span class="digital-seconds" id="digitalSeconds"><span class="colon">:</span><span id="seconds">00</span></span><span class="period" id="period"></span></div>
        <div class="time-caption" id="timeCaption">LOCAL TIME</div>
      </div>
    </div>
  </main>

  <footer class="bottom-bar chrome">
    <span class="footer-note">A little room for time.</span>
    <div class="mode-control" role="group" aria-label="Clock display">
      <button data-mode="analog" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>Analog</button>
      <button data-mode="digital" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 10v4m4-4v4m6-4v4"/></svg>Digital</button>
      <button data-mode="both" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="18" rx="2"/><rect x="14" y="3" width="7" height="18" rx="2"/></svg>Both</button>
    </div>
    <button class="footer-settings" id="footerSettings">Make it yours <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button>
  </footer>
  <button id="exitFocus" class="exit-focus" hidden>Exit focus</button>
  <div id="toast" class="toast" role="status"></div>

  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="settings-header"><div><span class="eyebrow">MAKE IT YOURS</span><h1 id="settingsTitle">Settings</h1></div><button id="closeSettings" class="icon-button" aria-label="Close settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div class="settings-content">
      <section><h2>Display</h2>
        <label class="field-label" for="language">Language</label><select id="language" data-setting="language"><option value="auto">Auto (device language)</option><option value="ja">日本語</option><option value="en">English</option></select>
        <label class="field-label" for="mode">Clock style</label><select id="mode" data-setting="mode"><option value="both">Analog & digital</option><option value="analog">Analog only</option><option value="digital">Digital only</option></select>
        <div class="two-fields"><div><label class="field-label" for="format">Time format</label><select id="format" data-setting="format"><option value="24">24-hour</option><option value="12">12-hour</option></select></div><div><label class="field-label" for="layout">Layout</label><select id="layout" data-setting="layout"><option value="stacked">Stacked</option><option value="side">Side by side</option></select></div></div>
        <label class="field-label" for="timezone">Time zone</label><select id="timezone" data-setting="timezone"><option value="local">Device time zone</option><option value="Asia/Tokyo">Tokyo</option><option value="Asia/Seoul">Seoul</option><option value="Asia/Shanghai">Shanghai</option><option value="Asia/Singapore">Singapore</option><option value="Asia/Kolkata">Kolkata</option><option value="Asia/Dubai">Dubai</option><option value="Europe/London">London</option><option value="Europe/Paris">Paris</option><option value="America/New_York">New York</option><option value="America/Chicago">Chicago</option><option value="America/Los_Angeles">Los Angeles</option><option value="Pacific/Honolulu">Honolulu</option><option value="Australia/Sydney">Sydney</option><option value="UTC">UTC</option></select>
        <label class="toggle-row"><span>Show date</span><input type="checkbox" data-setting="date" id="date"><span class="switch" aria-hidden="true"></span></label>
        <label class="toggle-row"><span>Show time zone</span><input type="checkbox" data-setting="zone" id="zone"><span class="switch" aria-hidden="true"></span></label>
        <div class="range-label"><label for="scale">Clock size</label><output id="scaleValue" for="scale">100%</output></div><input type="range" id="scale" data-setting="scale" min="70" max="130" step="5">
      </section>
      <section><h2>Appearance</h2>
        <label class="field-label" for="theme">Theme</label><div class="theme-options" role="group" aria-label="Theme"><button data-theme="light" aria-label="Light theme" title="Light" style="--swatch:#f2f3f1;--swatch-ink:#24272a"><span>Aa</span>Light</button><button data-theme="dark" aria-label="Dark theme" title="Dark" style="--swatch:#202224;--swatch-ink:#e8e9e6"><span>Aa</span>Dark</button><button data-theme="midnight" aria-label="Midnight theme" title="Midnight" style="--swatch:#101d31;--swatch-ink:#bdd0e9"><span>Aa</span>Midnight</button><button data-theme="paper" aria-label="Paper theme" title="Paper" style="--swatch:#eee7d8;--swatch-ink:#493f30"><span>Aa</span>Paper</button></div>
        <select id="theme" data-setting="theme" aria-label="Theme"><option value="auto">Match device</option><option value="light">Light</option><option value="dark">Dark</option><option value="midnight">Midnight</option><option value="paper">Paper</option></select>
        <label class="field-label" for="font">Digital font</label><select id="font" data-setting="font"><option value="sans">Modern sans</option><option value="serif">Classic serif</option><option value="mono">Monospace</option><option value="rounded">Rounded</option></select>
        <label class="field-label" for="dialFont">Dial font</label><select id="dialFont" data-setting="dialFont"><option value="serif">Classic serif</option><option value="sans">Modern sans</option><option value="mono">Monospace</option><option value="rounded">Rounded</option></select>
        <span class="field-label">Accent color</span><div class="accent-options" role="group" aria-label="Accent color"><button data-accent="#cf553d" style="--color:#cf553d" aria-label="Terracotta"></button><button data-accent="#4f78c4" style="--color:#4f78c4" aria-label="Blue"></button><button data-accent="#438d76" style="--color:#438d76" aria-label="Green"></button><button data-accent="#b57b27" style="--color:#b57b27" aria-label="Amber"></button><button data-accent="#9271be" style="--color:#9271be" aria-label="Violet"></button><label class="custom-color" title="Custom accent color"><input id="accent" type="color" data-setting="accent" aria-label="Custom accent color"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></label></div>
      </section>
      <section><h2>Analog clock</h2>
        <label class="toggle-row"><span>Second hand</span><input type="checkbox" id="analogSeconds" data-setting="analogSeconds"><span class="switch" aria-hidden="true"></span></label>
        <label class="field-label" for="motion">Second hand movement</label><select id="motion" data-setting="motion"><option value="sweep">Smooth sweep</option><option value="tick">One-second ticks</option></select>
        <label class="field-label" for="markers">Hour markers</label><select id="markers" data-setting="markers"><option value="numbers">Numbers</option><option value="roman">Roman numerals</option><option value="minimal">Minimal</option></select>
        <label class="toggle-row"><span>Minute marks</span><input type="checkbox" id="minuteMarks" data-setting="minuteMarks"><span class="switch" aria-hidden="true"></span></label>
      </section>
      <section><h2>Digital clock</h2>
        <label class="toggle-row"><span>Show seconds</span><input type="checkbox" id="digitalSecondsSetting" data-setting="digitalSeconds"><span class="switch" aria-hidden="true"></span></label>
        <label class="toggle-row"><span>Blink separators</span><input type="checkbox" id="blink" data-setting="blink"><span class="switch" aria-hidden="true"></span></label>
        <label class="toggle-row"><span>Leading zero</span><input type="checkbox" id="leadingZero" data-setting="leadingZero"><span class="switch" aria-hidden="true"></span></label>
      </section>
    </div>
    <div class="settings-footer"><span id="saveStatus" role="status">Changes save automatically</span><button id="resetButton">Reset settings</button></div>
  </dialog>
  <dialog id="resetDialog" class="confirm-dialog" aria-labelledby="resetTitle"><h2 id="resetTitle">Reset your clock?</h2><p>Restore the original display and appearance settings.</p><div class="confirm-actions"><button id="cancelReset">Cancel</button><button id="confirmReset" class="primary-button">Reset settings</button></div></dialog>
</body>
</html>
